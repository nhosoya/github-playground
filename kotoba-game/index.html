<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7e8">
<title>ことばで ぽんぽんあそび</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#dff6ff,#fff7e8);touch-action:none;user-select:none}#game{position:fixed;inset:0;overflow:hidden}.sun{position:absolute;right:5vw;top:5vh;width:min(19vw,150px);aspect-ratio:1;border-radius:50%;background:#ffd95a;box-shadow:0 0 0 16px #ffd95a2b;animation:float 4s ease-in-out infinite}.cloud{position:absolute;width:min(28vw,240px);height:min(8vw,70px);background:#fff;border-radius:999px;opacity:.88;filter:drop-shadow(0 6px 8px #0001)}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:40%;height:150%;left:18%;bottom:0}.cloud:after{width:33%;height:120%;right:15%;bottom:0}.c1{left:5vw;top:9vh}.c2{right:21vw;top:25vh;transform:scale(.75)}.ground{position:absolute;left:-5%;right:-5%;bottom:-8vh;height:34vh;background:#bde98f;border-radius:50% 50% 0 0/18% 18% 0 0;box-shadow:inset 0 18px 0 #ffffff29}#hint{position:absolute;left:50%;top:3.5vh;transform:translateX(-50%);font-weight:900;font-size:clamp(19px,5vw,38px);color:#263238;text-shadow:0 2px white;white-space:nowrap;opacity:.84;pointer-events:none}.toy{position:absolute;width:min(31vw,190px);height:min(31vw,190px);min-width:112px;min-height:112px;border-radius:50%;display:grid;place-items:center;font-size:min(18vw,115px);filter:drop-shadow(0 10px 8px #0002);cursor:pointer;animation:bob 2.2s ease-in-out infinite}.toy:active{transform:scale(.9)}#word{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;font-size:clamp(46px,16vw,112px);font-weight:1000;color:#243238;text-shadow:0 5px 0 #fff,0 8px 18px #0003;opacity:0}#word.show{animation:wordpop 1.15s ease-out forwards}.star{position:absolute;pointer-events:none;font-size:clamp(25px,8vw,72px);animation:burst .8s ease-out forwards}.ring{position:absolute;border:8px solid #ffffffe6;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:ring .65s ease-out forwards}#sound{position:absolute;right:12px;bottom:max(18px,env(safe-area-inset-bottom));z-index:30;border:0;border-radius:999px;padding:11px 15px;font-weight:900;background:#ffffffdd;box-shadow:0 4px 12px #0002}#start{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#dff6ff,#fff7e8);display:grid;place-items:center;padding:24px}#start button{width:min(78vw,420px);aspect-ratio:1.7;border:0;border-radius:42px;background:#ffd95a;box-shadow:0 14px 0 #e6b83f,0 22px 30px #0003;font-size:clamp(28px,8vw,58px);font-weight:900;color:#4a3a16}#start button:active{transform:translateY(8px);box-shadow:0 6px 0 #e6b83f}.sub{position:absolute;bottom:8vh;font-size:clamp(14px,4vw,22px);font-weight:800;color:#52656d;opacity:.8}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}@keyframes wordpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(.95)}}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0}}@keyframes ring{0%{width:10px;height:10px;opacity:1}100%{width:230px;height:230px;opacity:0}}
</style>
</head>
<body>
<div id="game"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="ground"></div><div id="hint">さわって まねしてみよう！</div><div id="word"></div><button id="sound">🔊 おと</button></div>
<div id="start"><button id="startBtn">▶ ことばで あそぶ</button><div class="sub">タップすると ことばが きこえるよ</div></div>
<script>
(()=>{
const game=document.querySelector('#game'),start=document.querySelector('#start'),startBtn=document.querySelector('#startBtn'),word=document.querySelector('#word'),sound=document.querySelector('#sound');
const toys=[
{e:'🐶',c:'#ffd166',w:'わんわん',n:[392,523,659]},{e:'🐱',c:'#ff9aa2',w:'にゃー',n:[440,554,659]},{e:'🐥',c:'#fff176',w:'ぴよぴよ',n:[523,659,784]},{e:'🐸',c:'#80ed99',w:'けろけろ',n:[330,392,494]},{e:'🦁',c:'#ffb347',w:'がおー',n:[349,440,523]},{e:'🐰',c:'#f7c6ff',w:'うさぎ',n:[494,659,784]},{e:'🐳',c:'#8bd3ff',w:'くじら',n:[262,392,523]},{e:'🚗',c:'#ff6b6b',w:'ぶーぶー',n:[262,330,392]},{e:'⭐',c:'#ffe66d',w:'きらきら',n:[523,784,1046]},{e:'⚽️',c:'#fff',w:'ぼーる',n:[294,440,587]},{e:'🍎',c:'#ff7b7b',w:'りんご',n:[392,494,659]},{e:'🍌',c:'#fff176',w:'ばなな',n:[440,554,659]}];
let ctx,current,last=-1,jaVoice=null;
function initAudio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}
function tone(f,delay=0,d=.18,gain=.09){initAudio();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+d);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+d+.04)}
function notes(ns){ns.forEach((n,i)=>tone(n,i*.07,.2,.08))}
function loadVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();jaVoice=vs.find(v=>/^ja[-_]/i.test(v.lang))||vs.find(v=>v.lang==='ja-JP')||null}
loadVoice();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoice;
function speak(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=.68;u.pitch=1.08;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function showWord(t){word.textContent=t;word.classList.remove('show');void word.offsetWidth;word.classList.add('show')}
function burst(x,y){const r=document.createElement('div');r.className='ring';r.style.left=x+'px';r.style.top=y+'px';game.appendChild(r);setTimeout(()=>r.remove(),700);const icons=['⭐','✨','💛','🫧','🌈'];for(let i=0;i<9;i++){const s=document.createElement('div');s.className='star';s.textContent=icons[Math.random()*icons.length|0];s.style.left=x+'px';s.style.top=y+'px';const a=Math.PI*2*i/9,d=70+Math.random()*120;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');game.appendChild(s);setTimeout(()=>s.remove(),850)}}
function place(el){const w=Math.max(112,Math.min(innerWidth*.31,190)),m=18,minY=Math.max(95,innerHeight*.16),maxY=Math.max(minY+10,innerHeight-w-Math.max(75,innerHeight*.13));el.style.left=m+Math.random()*Math.max(1,innerWidth-w-m*2)+'px';el.style.top=minY+Math.random()*Math.max(1,maxY-minY)+'px'}
function newToy(){if(current)current.remove();let i;do i=Math.random()*toys.length|0;while(i===last);last=i;const t=toys[i],el=document.createElement('div');el.className='toy';el.textContent=t.e;el.style.background=t.c;place(el);el.addEventListener('pointerdown',e=>{e.preventDefault();const x=e.clientX,y=e.clientY;notes(t.n);showWord(t.w);speak(t.w);burst(x,y);el.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-8deg)'},{transform:'scale(.95) rotate(7deg)'},{transform:'scale(1)'}],{duration:430});setTimeout(newToy,650)},{passive:false});game.appendChild(el);current=el}
game.addEventListener('pointerdown',e=>{if(e.target.classList.contains('toy')||e.target===sound)return;tone(280+(e.clientX/innerWidth)*380);burst(e.clientX,e.clientY)},{passive:false});
startBtn.addEventListener('click',()=>{initAudio();tone(440,0,.05,.02);loadVoice();speak('こんにちは');setTimeout(()=>speechSynthesis?.cancel(),180);start.style.display='none';notes([392,523,659,784]);newToy()});
sound.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();loadVoice();speak('おとが でるよ');notes([523,659,784])},{passive:false});
window.addEventListener('resize',()=>current&&place(current));
})();
</script>
</body>
</html>
