<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7e8">
<title>ことばで ぽんぽんあそび</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#dff6ff,#fff7e8);touch-action:none;user-select:none}#game{position:fixed;inset:0;overflow:hidden}.sun{position:absolute;right:5vw;top:5vh;width:min(19vw,150px);aspect-ratio:1;border-radius:50%;background:#ffd95a;box-shadow:0 0 0 16px rgba(255,217,90,.17);animation:float 4s ease-in-out infinite}.cloud{position:absolute;width:min(28vw,240px);height:min(8vw,70px);background:#fff;border-radius:999px;opacity:.88;filter:drop-shadow(0 6px 8px rgba(0,0,0,.08))}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:40%;height:150%;left:18%;bottom:0}.cloud:after{width:33%;height:120%;right:15%;bottom:0}.c1{left:5vw;top:8vh}.c2{right:20vw;top:25vh;transform:scale(.75)}.ground{position:absolute;left:-5%;right:-5%;bottom:-8vh;height:34vh;background:#bde98f;border-radius:50% 50% 0 0/18% 18% 0 0;box-shadow:inset 0 18px 0 rgba(255,255,255,.16)}#hint{position:absolute;left:50%;top:3.5vh;transform:translateX(-50%);font-weight:900;font-size:clamp(19px,5vw,38px);color:#263238;text-shadow:0 2px #fff;white-space:nowrap;opacity:.84;pointer-events:none}.toy{position:absolute;width:min(31vw,190px);height:min(31vw,190px);min-width:112px;min-height:112px;border-radius:50%;display:grid;place-items:center;font-size:min(18vw,115px);filter:drop-shadow(0 10px 8px rgba(0,0,0,.16));cursor:pointer;animation:bob 2.2s ease-in-out infinite}.toy:active{transform:scale(.9)}#word{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;font-size:clamp(46px,16vw,112px);font-weight:1000;color:#243238;text-shadow:0 5px 0 #fff,0 8px 18px rgba(0,0,0,.18);opacity:0}#word.show{animation:wordpop 1.1s ease-out forwards}.star{position:absolute;pointer-events:none;font-size:clamp(25px,8vw,72px);animation:burst .8s ease-out forwards}.ring{position:absolute;border:8px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:ring .65s ease-out forwards}#recordLink,#sound{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));z-index:30;border:0;border-radius:999px;padding:11px 15px;font-weight:900;background:rgba(255,255,255,.88);box-shadow:0 4px 12px rgba(0,0,0,.12);color:#344}#recordLink{left:12px;text-decoration:none}#sound{right:12px}#start{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#dff6ff,#fff7e8);display:grid;place-items:center;padding:24px}#start button{width:min(78vw,420px);aspect-ratio:1.7;border:0;border-radius:42px;background:#ffd95a;box-shadow:0 14px 0 #e6b83f,0 22px 30px rgba(0,0,0,.18);font-size:clamp(28px,8vw,58px);font-weight:900;color:#4a3a16}#start button:active{transform:translateY(8px);box-shadow:0 6px 0 #e6b83f}.sub{position:absolute;bottom:8vh;font-size:clamp(14px,4vw,22px);font-weight:800;color:#52656d;opacity:.8;text-align:center;padding:0 24px}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}@keyframes wordpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(.95)}}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0}}@keyframes ring{0%{width:10px;height:10px;opacity:1}100%{width:230px;height:230px;opacity:0}}
</style>
</head>
<body>
<div id="game"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="ground"></div><div id="hint">さわって まねしてみよう！</div><div id="word"></div><a id="recordLink" href="./record.html">🎤 ろくおん</a><button id="sound" type="button">🔊 おと</button></div>
<div id="start"><button id="startBtn">▶ ことばで あそぶ</button><div class="sub">えをタップして ことばをまねしてみよう</div></div>
<script>
(()=>{
const game=document.getElementById('game'),start=document.getElementById('start'),startBtn=document.getElementById('startBtn'),wordEl=document.getElementById('word'),soundBtn=document.getElementById('sound'),recordLink=document.getElementById('recordLink');
const toys=[
{e:'🐶',c:'#ffd166',w:'わんわん',k:'wanwan',n:[392,523,659]},{e:'🐱',c:'#ff9aa2',w:'にゃー',k:'nyaa',n:[440,554,659]},{e:'🐥',c:'#fff176',w:'ぴよぴよ',k:'piyopiyo',n:[523,659,784]},{e:'🐸',c:'#80ed99',w:'けろけろ',k:'kerokero',n:[330,392,494]},{e:'🦁',c:'#ffb347',w:'がおー',k:'gaoo',n:[349,440,523]},{e:'🐰',c:'#f7c6ff',w:'うさぎ',k:'usagi',n:[494,659,784]},{e:'🐳',c:'#8bd3ff',w:'くじら',k:'kujira',n:[262,392,523]},{e:'🐼',c:'#e8e8e8',w:'ぱんだ',k:'panda',n:[294,392,587]},{e:'🚗',c:'#ff6b6b',w:'ぶーぶー',k:'buubuu',n:[262,330,392]},{e:'🚌',c:'#ffd166',w:'ばす',k:'bus',n:[330,392,523]},{e:'🚃',c:'#bdb2ff',w:'でんしゃ',k:'densha',n:[330,440,554]},{e:'✈️',c:'#d8f3ff',w:'ひこうき',k:'hikouki',n:[523,659,784]},{e:'⭐',c:'#ffe66d',w:'きらきら',k:'kirakira',n:[523,784,1046]},{e:'⚽️',c:'#fff',w:'ぼーる',k:'ball',n:[294,440,587]},{e:'🍎',c:'#ff7b7b',w:'りんご',k:'ringo',n:[392,494,659]},{e:'🍌',c:'#fff176',w:'ばなな',k:'banana',n:[440,554,659]},{e:'🍓',c:'#ff8fab',w:'いちご',k:'ichigo',n:[494,587,740]},{e:'🧸',c:'#cfa670',w:'くま',k:'kuma',n:[262,330,392]},{e:'👶',c:'#bde0fe',w:'あかちゃん',k:'akachan',n:[523,659,587]},{e:'👨',c:'#cde7be',w:'ぱぱ',k:'papa',n:[392,392,523]},{e:'👩',c:'#f7c6ff',w:'まま',k:'mama',n:[392,494,494]}];
let audioCtx,current,lastIndex=-1;const voiceUrls=new Map();
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('kotoba-voice-db',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('voices'))db.createObjectStore('voices')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function getRecordedVoice(key){try{const db=await openDB();return await new Promise((resolve,reject)=>{const tx=db.transaction('voices','readonly'),r=tx.objectStore('voices').get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,delay=0,duration=.18,gain=.09,type='sine'){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);g.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+duration);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+duration+.04)}
function chime(ns){ns.forEach((n,i)=>tone(n,i*.07,.2,.08,i===2?'triangle':'sine'))}
async function playVoice(key){const blob=await getRecordedVoice(key);if(!blob)return;let url=voiceUrls.get(key);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);voiceUrls.set(key,url);const a=new Audio(url);a.playsInline=true;try{await a.play()}catch(e){}}
function showWord(text){wordEl.textContent=text;wordEl.classList.remove('show');void wordEl.offsetWidth;wordEl.classList.add('show')}
function burst(x,y){const r=document.createElement('div');r.className='ring';r.style.left=x+'px';r.style.top=y+'px';game.appendChild(r);setTimeout(()=>r.remove(),700);const icons=['⭐','✨','💛','🫧','🌈'];for(let i=0;i<9;i++){const s=document.createElement('div');s.className='star';s.textContent=icons[Math.random()*icons.length|0];s.style.left=x+'px';s.style.top=y+'px';const a=Math.PI*2*i/9,d=70+Math.random()*120;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');game.appendChild(s);setTimeout(()=>s.remove(),850)}}
function place(el){const w=Math.max(112,Math.min(innerWidth*.31,190)),m=18,minY=Math.max(95,innerHeight*.16),maxY=Math.max(minY+10,innerHeight-w-Math.max(75,innerHeight*.13));el.style.left=m+Math.random()*Math.max(1,innerWidth-w-m*2)+'px';el.style.top=minY+Math.random()*Math.max(1,maxY-minY)+'px'}
function newToy(){if(current)current.remove();let i;do i=Math.random()*toys.length|0;while(i===lastIndex);lastIndex=i;const t=toys[i],el=document.createElement('div');el.className='toy';el.textContent=t.e;el.style.background=t.c;place(el);el.addEventListener('pointerdown',e=>{e.preventDefault();const x=e.clientX,y=e.clientY;chime(t.n);showWord(t.w);playVoice(t.k);burst(x,y);el.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-8deg)'},{transform:'scale(.95) rotate(7deg)'},{transform:'scale(1)'}],{duration:430});setTimeout(newToy,650)},{passive:false});game.appendChild(el);current=el}
game.addEventListener('pointerdown',e=>{if(e.target.classList.contains('toy')||e.target===soundBtn||e.target===recordLink)return;tone(280+(e.clientX/innerWidth)*380,0,.14,.07,'triangle');burst(e.clientX,e.clientY)},{passive:false});
startBtn.addEventListener('click',()=>{initAudio();tone(440,0,.05,.02);start.style.display='none';chime([392,523,659,784]);newToy()});soundBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();chime([523,659,784]);showWord('ぽん！')},{passive:false});window.addEventListener('resize',()=>current&&place(current));
})();
</script>
</body>
</html>
